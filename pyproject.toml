[project]
name = "memomate"
version = "0.1.0"
description = "Memory MCP Server for AI assistants, alongside a growing collection of utility MCP Servers"
authors = [{ name = "Duan Xinxin" }]
requires-python = ">=3.11"
readme = "README.md"
license = { text = "MIT" }
keywords = ["mcp", "memory", "agent", "llm", "rag"]
dependencies = [
    # Streamable HTTP / SSE transports (runtime/transport.py) need a recent
    # FastMCP. mcp bundles starlette + uvicorn as core deps, so no HTTP extra
    # is required.
    "mcp>=1.12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
]

[project.scripts]
memomate-core = "core.server:main"
memomate-arxiv = "servers.arxiv_search.server:main"
memomate-bilibili = "servers.bilibili_search.server:main"
memomate-zhihu = "servers.zhihu_search.server:main"
memomate-weather = "servers.weather_cn.server:main"
memomate-github-trending = "servers.github_trending.server:main"
memomate-hackernews = "servers.hackernews.server:main"
memomate-wechat-mp = "servers.wechat_mp.server:main"
memomate-stackoverflow = "servers.stackoverflow.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["core", "runtime", "servers"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -m 'not network'"
markers = [
    "network: tests that require live network access (deselected by default)",
]
